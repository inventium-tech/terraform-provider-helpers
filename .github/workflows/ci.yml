name: Continuous Integration

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  build:
    name: Go Build
    runs-on: ubuntu-24.04
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: ./.github/actions/setup-go
      - name: Go Build
        run: go build -v ./...

  lint:
    name: Linters
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: ./.github/actions/setup-go
      - name: GolangCI Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          args: --config=.linters/.golangci.yml
      - name: MegaLinter
        uses: oxsecurity/megalinter/flavors/go@f2fe8c1cba37091848df3e524066c8c23ef353ed # v10.2.0
        id: ml
        env:
          VALIDATE_ALL_CODEBASE: true
          DEFAULT_WORKSPACE: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Archive reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ success() || failure() }}
        with:
          name: MegaLinter reports
          path: .ml-reports/
          include-hidden-files: true

  unit-tests:
    name: Go Unit Tests
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: ./.github/actions/setup-go
      - name: Run Unit Tests
        run: go test ./... -v -coverprofile=unit-tests-report.lcov -json > unit-tests-report.log
      - name: Codecov Upload Coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          files: unit-tests-report.lcov
          flags: unit-tests
      - name: Codecov Upload Test Results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: unit-tests-report.log
      - name: Upload Test Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-tests-report-${{ github.sha }}
          path: |
            unit-tests-report.lcov
            unit-tests-report.log
          retention-days: 7
          overwrite: true

  integration-tests:
    name: Go Integration Tests
    runs-on: ubuntu-24.04
    needs: build
    strategy:
      matrix:
        tf-version: ['1.11.*', '1.12.*', '1.13.*', '1.14.*']
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: ./.github/actions/setup-go
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.tf-version }}
          terraform_wrapper: false
      - name: Set safe TF_VERSION
        run: echo "TF_VERSION_SAFE=$(echo '${{ matrix.tf-version }}' | sed 's/\*/x/g')" >> "$GITHUB_ENV"
      - name: Run Integration Tests
        run: >-
          go test ./internal/provider -v -coverprofile="integration-tests-report-${TF_VERSION_SAFE}.lcov"
          -json > "integration-tests-report-${TF_VERSION_SAFE}.log"
        env:
          TF_ACC: '1'
      - name: Codecov Upload Coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          files: integration-tests-report-${{ env.TF_VERSION_SAFE }}.lcov
          flags: integration-tests
      - name: Codecov Upload Test Results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: integration-tests-report-${{ env.TF_VERSION_SAFE }}.log
      - name: Upload Test Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-tests-report-tf${{ env.TF_VERSION_SAFE }}-${{ github.sha }}
          path: |
            integration-tests-report-${{ env.TF_VERSION_SAFE }}.lcov
            integration-tests-report-${{ env.TF_VERSION_SAFE }}.log
          retention-days: 7
          overwrite: true

  sonar:
    name: SonarCloud Scan
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    needs: [unit-tests, integration-tests]
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download Unit Test Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unit-tests-report-${{ github.sha }}
          path: unit-tests/
      - name: Download Integration Test Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: integration-tests-report-*-${{ github.sha }}
          path: integration-tests/
          merge-multiple: true
      - name: Sonarqube Scan
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  codeql:
    name: CodeQL Scan
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    needs: build
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CodeQL Analysis
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: go
      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: '/language:go'
