name: Release

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  semantic-dry-run:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
      # Preset v10 requires writer v9; release-notes-generator currently uses writer v8.
      - run: >-
          npm install --ignore-scripts --no-save --package-lock=false
          semantic-release@25.0.9 conventional-changelog-conventionalcommits@9.3.1
      - name: Semantic Release (dry-run)
        run: ./node_modules/.bin/semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semantic-release:
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    outputs:
      released: ${{ steps.detect_release.outputs.released }}
      tag: ${{ steps.detect_release.outputs.tag }}
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
      # Preset v10 requires writer v9; release-notes-generator currently uses writer v8.
      - run: >-
          npm install --ignore-scripts --no-save --package-lock=false
          semantic-release@25.0.9 conventional-changelog-conventionalcommits@9.3.1
      - name: Capture tags on HEAD before release
        run: git tag --points-at HEAD --list 'v*' | sort > /tmp/head-tags-before.txt
      - name: Semantic Release
        run: ./node_modules/.bin/semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Detect published release tag
        id: detect_release
        shell: bash
        run: |
          git tag --points-at HEAD --list 'v*' | sort > /tmp/head-tags-after.txt
          new_tag="$(comm -13 /tmp/head-tags-before.txt /tmp/head-tags-after.txt | tail -n 1)"

          if [[ -n "$new_tag" ]]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$new_tag" >> "$GITHUB_OUTPUT"
            echo "Release created for tag: $new_tag"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "No release tag created in this run."
          fi

  goreleaser:
    if: needs.semantic-release.outputs.released == 'true'
    runs-on: ubuntu-24.04
    needs: semantic-release
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: ./.github/actions/setup-go
      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
