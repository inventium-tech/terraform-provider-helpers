sonar.go.tests.reportPaths=unit-tests/unit-tests-report.log,integration-tests/integration-tests-report-1.11.x.log,integration-tests/integration-tests-report-1.12.x.log,integration-tests/integration-tests-report-1.13.x.log,integration-tests/integration-tests-report-1.14.x.log
sonar.go.coverage.reportPaths=unit-tests/unit-tests-report.lcov,integration-tests/integration-tests-report-1.11.x.lcov,integration-tests/integration-tests-report-1.12.x.lcov,integration-tests/integration-tests-report-1.13.x.lcov,integration-tests/integration-tests-report-1.14.x.lcov
sonar.coverage.exclusions=**/*_test.go
sonar.cpd.exclusions=**/*_test.go
